# -------------------
# Publish
# -------------------

publish:
  # Maven
  group-id: io.github.mflisar.composechangelog
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central # [none, maven-central, github]
  test-target: github # [none, maven-central, github]

# -------------------
# Config
# -------------------

config:
  # Java
  java-version: 17
  # Developer
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# -------------------
# Apps
# -------------------

apps:
  - name: ComposeChangelog Demo
    namespace: com.michaelflisar.composechangelog.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/android
      - demo/app/jvm
      - demo/app/wasm
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

# -------------------
# Project
# -------------------

project:
  # Github Library
  namespace: com.michaelflisar.composechangelog
  repo-name: ComposeChangelog
  release: 2023
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# -------------------
# Modules
# -------------------

modules:
  # Modules - list of modules [artifact-id, description, path, (plugin)]
  primary-artifact-id: core # used to detect latest release version of the library (dynamically on the published homepage)
  modules:
    - artifact-id: core
      description: provides all the basic classes and composables to show a changelog
      path: library/core
    - artifact-id: renderer-header
      description: implements rendering of a <header> tag
      path: library/modules/renderer/header
    - artifact-id: statesaver-kotpreferences
      description: provides a simple state saver based on KotPreferences
      path: library/modules/statesaver/kotpreferences
    - artifact-id: statesaver-preferences
      description: provides a simple state saver based on jetpack preferences
      path: library/modules/statesaver/preferences
    - artifact-id: gradle-plugin
      description: This is a gradle plugin that offers functions to generate version numbers from a version string
      path: library/gradle-plugin
      plugin: true
    - artifact-id: shared
      description: shared classes between the gradle plugin and the library - no need to include this manually!
      path: library/shared
      internal: true
  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# -------------------
# Documentation
# -------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
